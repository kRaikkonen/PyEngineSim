# Briefcase packaging for the iOS build of car mode.
#
# This does NOT package the desktop app -- run.py / pygame stay exactly as they
# are.  The phone build ships only what car mode needs: the engine_sim package,
# numpy, and a thin Toga shell.  No pygame, no display stack (car mode draws
# nothing by design), so `requires` is deliberately tiny.
#
#   cd engine-sim-py
#   briefcase create iOS && briefcase build iOS && briefcase run iOS
#
# See docs/IOS_PORT.md for the environment (DEVELOPER_DIR, uv, no sudo).

[tool.briefcase]
project_name = "PyEngineSim"
bundle = "com.pyenginesim"
version = "1.0"
url = "https://github.com/kRaikkonen/PyEngineSim"
# Briefcase requires a PEP 639 license expression.  This repo has no LICENSE
# file and has never declared one, and "all rights reserved" is exactly what
# that means by default -- so this asserts nothing new rather than inventing a
# licence on the author's behalf.  Replace it (and add a LICENSE file) if this
# is ever to be distributed to anyone else.
license = "LicenseRef-Proprietary"
author = "Leo"
author_email = "noreply@pyenginesim.dev"

[tool.briefcase.app.pyenginesim]
formal_name = "PyEngineSim"
description = "Your car, with a different engine's voice"
long_description = """Reads your real car's rpm from an OBD-II dongle and plays
whichever of 130 white-box simulated engines you pick, at your car's revs.
"""
sources = [
    "src/pyenginesim",
    "engine_sim",
    "tools",
]
requires = []

[tool.briefcase.app.pyenginesim.iOS]
requires = [
    "toga-iOS~=0.5.0",
    # 1.0.x is what exists for iOS (2.x is the macOS line).  Worth having: it
    # redirects stdout/stderr into the system log, which is the only way to
    # see a traceback from a phone.
    "std-nslog~=1.0",
    # numpy is the ONLY heavy dependency.  Briefcase resolves iOS wheels from
    # the BeeWare secondary repo (anaconda.org/beeware), which publishes
    # cp313 builds for both arm64_iphoneos and x86_64_iphonesimulator -- the
    # second one matters because the build Mac is a 2017 Intel machine.
    # scipy is deliberately absent: audio.py has a pure-numpy fallback for
    # every scipy call (_HAVE_SCIPY), same as the Android build.
    "numpy",
]

# macOS is kept only so the same shell can be run on the laptop while
# iterating -- it is not a shipping target (that is run.py).
[tool.briefcase.app.pyenginesim.macOS]
universal_build = false
requires = [
    "toga-cocoa~=0.5.0",
    "std-nslog~=2.0.0",
    "numpy",
]
